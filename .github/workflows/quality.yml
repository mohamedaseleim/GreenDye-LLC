name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongodb-ci -p 27017:27017 mongo:7.0.16-jammy mongod --replSet rs0 --bind_ip_all
          for i in {1..30}; do docker exec mongodb-ci mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' && break; sleep 2; done
          docker exec mongodb-ci mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do docker exec mongodb-ci mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep true && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: node deployment/scripts/quality-gate.js
      - run: node deployment/scripts/acceptance-all.js
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm run test:unit
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/greendye-test?replicaSet=rs0
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: CI=true GENERATE_SOURCEMAP=false npm run build:verified
        working-directory: frontend
      - run: CI=true npm test -- --watchAll=false --runInBand
        working-directory: frontend
